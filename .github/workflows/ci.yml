name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify & Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 1. Install dependencies
        run: npm ci

      - name: 2. Run ESLint
        run: npm run lint

      - name: 3. Verify TypeScript types
        run: npm run typecheck

      - name: 4. Run unit tests
        run: npm run test

      - name: 5. Production build
        run: npm run build
